# ==========================================
# enPromote Nginx 反向代理与前端静态资源配置
# ==========================================
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 客户端上传限制（放宽至 50MB，支持口语录音与图片上传）
    client_max_body_size 50m;

    # Gzip 压缩支持
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # 静态静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # SPA 单页应用路由兜底（支持 vue-router 的 HTML5 History 路由模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API 接口
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_http_version 1.1;

        # WebSocket 长连接升级协议支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 传递客户端真实网络上下文
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型流式输出与长耗时任务超时时间设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # 反向代理用户头像与上传文件
    location /avatars/ {
        proxy_pass http://server:3000/avatars/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 默认头像代理兜底
    location = /default-avatar.png {
        proxy_pass http://server:3000/default-avatar.png;
    }

    # 容器健康检查路由
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # 错误页面配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
